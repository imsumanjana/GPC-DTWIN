name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install --upgrade pyinstaller

      - name: Confirm architecture
        run: |
          python --version
          python -c "import platform; print(platform.machine())"
          sw_vers

      - name: Create macOS icon
        run: |
          rm -rf resources/GPC-DTwin.iconset
          mkdir -p resources/GPC-DTwin.iconset

          sips -z 16 16 resources/GPC-DTwin.png \
            --out resources/GPC-DTwin.iconset/icon_16x16.png

          sips -z 32 32 resources/GPC-DTwin.png \
            --out resources/GPC-DTwin.iconset/icon_16x16@2x.png

          sips -z 32 32 resources/GPC-DTwin.png \
            --out resources/GPC-DTwin.iconset/icon_32x32.png

          sips -z 64 64 resources/GPC-DTwin.png \
            --out resources/GPC-DTwin.iconset/icon_32x32@2x.png

          sips -z 128 128 resources/GPC-DTwin.png \
            --out resources/GPC-DTwin.iconset/icon_128x128.png

          sips -z 256 256 resources/GPC-DTwin.png \
            --out resources/GPC-DTwin.iconset/icon_128x128@2x.png

          sips -z 256 256 resources/GPC-DTwin.png \
            --out resources/GPC-DTwin.iconset/icon_256x256.png

          sips -z 512 512 resources/GPC-DTwin.png \
            --out resources/GPC-DTwin.iconset/icon_256x256@2x.png

          sips -z 512 512 resources/GPC-DTwin.png \
            --out resources/GPC-DTwin.iconset/icon_512x512.png

          sips -z 1024 1024 resources/GPC-DTwin.png \
            --out resources/GPC-DTwin.iconset/icon_512x512@2x.png

          iconutil -c icns \
            resources/GPC-DTwin.iconset \
            -o resources/GPC-DTwin.icns

      - name: Build GPC-DTwin application
        run: |
          rm -rf build dist release dmg-root

          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name "GPC-DTwin" \
            --icon "resources/GPC-DTwin.icns" \
            --osx-bundle-identifier "com.sumanjana.gpcdtwin" \
            --target-arch arm64 \
            --add-data "resources:resources" \
            "src/gpc_dtwin/__main__.py"

      - name: Create DMG
        run: |
          mkdir -p dmg-root release

          cp -R "dist/GPC-DTwin.app" "dmg-root/GPC-DTwin.app"
          ln -s /Applications "dmg-root/Applications"

          hdiutil create \
            -volname "GPC-DTwin 1.1.5" \
            -srcfolder "dmg-root" \
            -format UDZO \
            -ov \
            "release/GPC-DTwin-v1.1.5-macOS-arm64.dmg"

      - name: Generate SHA-256 checksum
        run: |
          cd release
          shasum -a 256 \
            "GPC-DTwin-v1.1.5-macOS-arm64.dmg" \
            > "GPC-DTwin-v1.1.5-macOS-arm64.sha256.txt"

      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: GPC-DTwin-v1.1.5-macOS-arm64
          path: |
            release/GPC-DTwin-v1.1.5-macOS-arm64.dmg
            release/GPC-DTwin-v1.1.5-macOS-arm64.sha256.txt
          if-no-files-found: error