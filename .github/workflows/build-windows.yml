name: Build Windows 64-bit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

jobs:
  windows64:
    name: Windows x64 package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Create release environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install -r requirements-lock.txt
          .\.venv\Scripts\python.exe -m pip install --no-deps -e .
          .\.venv\Scripts\python.exe -m pip check
          .\.venv\Scripts\python.exe -c "import sysconfig, struct; print(sysconfig.get_platform()); print(struct.calcsize('P')*8); raise SystemExit(0 if sysconfig.get_platform().lower() == 'win-amd64' and struct.calcsize('P')*8 == 64 else 2)"

      - name: Ensure modern Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $paths = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup." }
          $ver = (Get-Item $iscc).VersionInfo.ProductVersion
          Write-Host "Inno Setup compiler: $iscc"
          Write-Host "Inno Setup version: $ver"

      - name: Build and validate Windows64 installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_windows_installer.ps1

      - name: List release output
        shell: pwsh
        run: |
          Get-ChildItem .\release -File | Format-Table Name, Length, LastWriteTime

      - name: Upload Windows64 installer
        uses: actions/upload-artifact@v6
        with:
          name: GPC-DTwin-Windows64
          path: |
            release/GPC-DTwin-v*-Setup-Windows64.exe
            release/GPC-DTwin-v*-Setup-Windows64.exe.sha256.txt
          if-no-files-found: error
          retention-days: 30
